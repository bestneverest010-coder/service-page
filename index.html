<body>

<header class="header">
  <div class="header-content">
    <img src="Tvs_logo_png.png" alt="Logo" class="logo">
    <h1>JJ TVS Baramati</h1>
  </div>
</header>
  
  <div id="department-container"></div>
  
<script>
 

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVcu8V2TmJvvpfKRu0EW4REa1Bb65fRKVExlad2uRx5Ge97Kqc6dMYk3n29sJ6cCYpvDjhGIGMExl_/pub?output=csv";

fetch(sheetURL)
.then(response => response.text())
.then(csv => {

    const rows = csv.split("\n").slice(1);

    const container = document.getElementById("department-container");

    const groupedDepartments = {};

    rows.forEach(row => {

        const cols = row.split(",");

        if(cols.length < 4) return;

        const department = cols[0].trim();
        const name = cols[1].trim();
        const post = cols[2].trim();
        const number = cols[3].trim();

        if(!groupedDepartments[department]){
            groupedDepartments[department] = [];
        }

        groupedDepartments[department].push({
            name,
            post,
            number
        });

    });

    for(const department in groupedDepartments){

        const section = document.createElement("div");
        section.className = "department-section";

        const header = document.createElement("div");
        header.className = "department-header";
        header.innerHTML = `${department} ▼`;

        const content = document.createElement("div");
        content.className = "department-content";

        groupedDepartments[department].forEach(person => {

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <h3>${person.name}</h3>

                <p class="post">
                    ${person.post}
                </p>

                <p class="phone">
                    📞 +91 ${person.number}
                </p>

                <div class="buttons">

                    <a href="tel:+91${person.number}">
                        <button class="call">
                            Call
                        </button>
                    </a>

                    <a href="https://wa.me/91${person.number}" target="_blank">
                        <button class="whatsapp">
                            WhatsApp
                        </button>
                    </a>

                </div>
            `;

            content.appendChild(card);

        });

        header.addEventListener("click", () => {

            if(content.style.display === "block"){
                content.style.display = "none";
            } else {
                content.style.display = "block";
            }

        });

        section.appendChild(header);
        section.appendChild(content);

        container.appendChild(section);

    }

})
.catch(error => console.log(error));

</script>
  
</body>
