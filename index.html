}

header {

}

<body>

<header class="header">
  <div class="header-content">
    <img src="Tvs_logo_png.png" alt="Logo" class="logo">
    <h1>JJ TVS Baramati</h1>
  </div>
</header>
  
  <div id="department-container"></div>
  
<div class="container">
  <div id="department-container"></div>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVcu8V2TmJvvpfKRu0EW4REa1Bb65fRKVExlad2uRx5Ge97Kqc6dMYk3n29sJ6cCYpvDjhGIGMExl_/pub?output=csv";

fetch(sheetURL)
  .then(response => response.text())
  .then(data => {

    const rows = data.split("\n").slice(1);
    const container = document.getElementById("department-container");

    const departments = {};

    rows.forEach(row => {
      const cols = row.split(",");

      if(cols.length < 4) return;

      const department = cols[0].trim();
const name = cols[1].trim();
const post = cols[2].trim();
const phone = cols[3].trim();
const status = cols[4].trim();
      
      if(!departments[department]){
        departments[department] = [];
      }

departments[department].push({
  name,
  post,
  phone,
  status
});
    });

    for(const department in departments){

      const deptId = department.replace(/\s/g, '');

      container.innerHTML += `
        <div class="department-card" onclick="toggleDepartment('${deptId}')">
          ${department} ▼
        </div>

        <div class="staff-list" id="${deptId}">
          ${departments[department].map(staff => `
<div class="card">

  <div class="name">${staff.name}</div>

  <div class="post">${staff.post}</div>

  <div class="phone">
    📞 +91${staff.phone}
  </div>

  <div class="status ${staff.status.toLowerCase()}">
    ${staff.status}
  </div>

  <div class="buttons">

    <a href="tel:+91${staff.phone}">
      <button class="call">Call</button>
    </a>

    <a href="https://wa.me/91${staff.phone}">
      <button class="whatsapp">WhatsApp</button>
    </a>

  </div>

</div>
          `).join("")}
        </div>
      `;
    }
  });

function toggleDepartment(id){

  const section = document.getElementById(id);

  if(section.style.display === "block"){
    section.style.display = "none";
  } else {
    section.style.display = "block";
  }
}
</script>
  
</body>
</html>
